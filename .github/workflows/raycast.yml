name: Raycast extension
on:
  push:
    paths: ["raycast/**", ".github/workflows/raycast.yml"]
  pull_request:
    paths: ["raycast/**", ".github/workflows/raycast.yml"]
jobs:
  check:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: raycast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: raycast/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
