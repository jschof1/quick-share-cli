<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jack's Files</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --card-bg: #1a1a1a;
      --text: #f5f5f5;
      --text-muted: #888;
      --accent: #f59e0b;
      --accent-hover: #d97706;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    
    .nav {
      background: var(--card-bg);
      border-bottom: 1px solid #333;
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .nav-brand h1 {
      font-size: 1.2rem;
      font-weight: 700;
    }
    
    .nav-brand h1 span { color: var(--accent); }
    
    .nav-brand .subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    
    .nav-stats {
      display: flex;
      gap: 20px;
    }
    
    .nav-stat { text-align: center; }
    
    .nav-stat-value {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
    }
    
    .nav-stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 20px;
    }
    
    .folders {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    
    .folder-btn {
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid #333;
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .folder-btn:hover {
      border-color: var(--accent);
      background: #252525;
    }
    
    .folder-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 600;
    }
    
    .folder-btn .count {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-left: 6px;
    }
    
    .search-container {
      max-width: 500px;
      margin: 0 auto 15px;
      position: relative;
    }
    
    .search-input {
      width: 100%;
      padding: 12px 40px 12px 40px;
      background: var(--card-bg);
      border: 1px solid #333;
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus { border-color: var(--accent); }
    
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    
    .clear-search {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
    }
    
    .clear-search.visible { display: block; }
    
    .filters {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    
    .filter-btn {
      padding: 6px 14px;
      font-size: 0.85rem;
      background: var(--card-bg);
      border: 1px solid #333;
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .filter-btn:hover { border-color: var(--accent); }
    
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 600;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    
    .file-card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .file-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    
    .file-preview {
      height: 180px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #252525;
    }
    
    .file-preview img, .file-preview video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .file-preview .icon { font-size: 2.5rem; }
    
    .file-info { padding: 12px; }
    
    .file-name {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    
    .file-name:hover { color: var(--accent); }
    
    .file-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    
    .copy-btn {
      opacity: 1;
      background: var(--accent);
      border: none;
      border-radius: 5px;
      padding: 4px 10px;
      color: #000;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    
    .file-card:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--accent-hover); }
    .copy-btn.copied { background: #22c55e; }
    
    .loading, .error, .empty {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
    }
    
    .error { color: #ef4444; }
    
    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    
    a { color: var(--accent); text-decoration: none; }
    .file-preview video { object-fit: contain; }
    .file-name { white-space: normal; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 2.4em; }
    .file-preview { width: 100%; border: 0; color: inherit; cursor: pointer; }
    .file-preview:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .play-label { position: absolute; bottom: 10px; right: 10px; background: #000c; padding: 6px 10px; border-radius: 6px; font-size: .8rem; }
    dialog { width: min(960px, calc(100% - 24px)); max-height: calc(100dvh - 24px); margin: auto; padding: 18px; background: var(--card-bg); color: var(--text); border: 1px solid #555; border-radius: 12px; }
    dialog::backdrop { background: #000c; }
    .preview-header, .preview-actions { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
    .preview-header h2 { font-size: 1rem; overflow-wrap: anywhere; }
    .preview-header button, .preview-actions button, .preview-actions a { padding: 8px 12px; background: #303030; color: var(--text); border: 1px solid #666; border-radius: 6px; cursor: pointer; font-size: .9rem; }
    #previewBody { margin: 16px 0; min-height: 180px; display: flex; align-items: center; justify-content: center; }
    #previewBody img, #previewBody video { display: block; max-width: 100%; max-height: 70dvh; object-fit: contain; }
    #previewBody iframe { width: 100%; height: 65dvh; border: 0; background: white; }
    #previewBody audio { width: 100%; }
    .preview-actions { justify-content: flex-start; flex-wrap: wrap; }
    #previewStatus { color: var(--text-muted); font-size: .85rem; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <div class="nav-brand">
        <h1>Jack's <span>Files</span></h1>
        <span class="subtitle">Browse & download</span>
      </div>
      <div class="nav-stats">
        <div class="nav-stat">
          <div class="nav-stat-value" id="fileCount">-</div>
          <div class="nav-stat-label">Files</div>
        </div>
        <div class="nav-stat">
          <div class="nav-stat-value" id="totalSize">-</div>
          <div class="nav-stat-label">Size</div>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="folders" id="folders">
      <button class="folder-btn active" data-folder="">All Files</button>
    </div>
    
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="Search files...">
      <button class="clear-search" id="clearSearch">✕</button>
    </div>
    
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="image">Images</button>
      <button class="filter-btn" data-filter="video">Videos</button>
      <button class="filter-btn" data-filter="document">Docs</button>
      <button class="filter-btn" data-filter="archive">Archives</button>
    </div>
    
    <div id="files" class="grid">
      <div class="loading">Loading files...</div>
    </div>
    
    <footer>
      Powered by <a href="https://www.cloudflare.com/products/r2/">Cloudflare R2</a>
    </footer>
  </div>

  <dialog id="previewDialog" aria-labelledby="previewTitle">
    <div class="preview-header"><h2 id="previewTitle"></h2><button id="closePreview" type="button" aria-label="Close preview">✕</button></div>
    <div id="previewBody"></div>
    <div class="preview-actions"><a id="previewOpen" target="_blank" rel="noopener">Open original ↗</a><button id="previewCopy" type="button">Copy link</button><span id="previewStatus" role="status"></span></div>
  </dialog>
  <script>
    const PUBLIC_URL = 'https://pub-347aa0ad8b93489db6fe959dca5c3b05.r2.dev';
    const WORKER_URL = 'https://jack-files-api.jackschofield1.workers.dev/files';
    
    let allFiles = [];
    let currentFolder = '';
    let currentFilter = 'all';
    let searchQuery = '';
    let folderCounts = {};
    
    const FILE_ICONS = {
      'image/': '🖼️', 'video/': '🎬', 'audio/': '🎵',
      'application/pdf': '📄', 'application/zip': '📦', 'application/': '📁'
    };
    
    const CATEGORIES = {
      image: ['jpg','jpeg','png','gif','webp','svg','bmp','ico'],
      video: ['mp4','mov','webm','avi','mkv'],
      audio: ['mp3','wav','m4a','ogg','aac','flac'],
      document: ['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','json','xml','csv','html','htm'],
      archive: ['zip','rar','tar','gz','7z','bz2']
    };
    
    function getCategory(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      for (const [cat, exts] of Object.entries(CATEGORIES)) {
        if (exts.includes(ext)) return cat;
      }
      return 'other';
    }
    
    function getIcon(mimeType) {
      if (!mimeType) return '📁';
      for (const [prefix, icon] of Object.entries(FILE_ICONS)) {
        if (mimeType.startsWith(prefix)) return icon;
      }
      return '📁';
    }
    
    function formatSize(bytes) {
      if (!bytes) return '-';
      const units = ['B', 'KB', 'MB', 'GB'];
      let i = 0;
      while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
      return bytes.toFixed(1) + ' ' + units[i];
    }
    
    function getFolders(files) {
      const folders = { '': 0 };
      files.forEach(f => {
        const parts = f.name.split('/');
        if (parts.length > 1) {
          const folder = parts[0];
          folders[folder] = (folders[folder] || 0) + 1;
        } else {
          folders['']++;
        }
      });
      return folders;
    }
    
    function getFilteredFiles() {
      let files = allFiles;
      
      // Apply folder filter
      if (currentFolder) {
        files = files.filter(f => f.name.startsWith(currentFolder + '/'));
      }
      
      // Apply category filter
      if (currentFilter !== 'all') {
        files = files.filter(f => getCategory(f.name) === currentFilter);
      }
      
      // Apply search
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase().trim();
        files = files.filter(f => f.name.toLowerCase().includes(q));
      }
      
      return files;
    }
    
    function renderFolders() {
      const container = document.getElementById('folders');
      const folderNames = Object.keys(folderCounts).filter(f => f !== '' || folderCounts[''] > 0);
      
      let html = `<button class="folder-btn ${currentFolder === '' ? 'active' : ''}" data-folder="">All Files <span class="count">(${folderCounts[''] || 0})</span></button>`;
      
      folderNames.filter(f => f).forEach(folder => {
        const safeFolder = escapeHtml(folder);
        html += `<button class="folder-btn ${currentFolder === folder ? 'active' : ''}" data-folder="${safeFolder}">${safeFolder} <span class="count">(${folderCounts[folder]})</span></button>`;
      });
      
      container.innerHTML = html;
      
      // Re-attach listeners
      container.querySelectorAll('.folder-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          container.querySelectorAll('.folder-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFolder = btn.dataset.folder;
          renderFiles();
        });
      });
    }
    
    function escapeHtml(value) {
      return String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
    }

    function fileUrl(file) {
      return PUBLIC_URL + '/' + file.name.split('/').map(encodeURIComponent).join('/');
    }

    let thumbnailObserver;
    function renderFiles() {
      const filesDiv = document.getElementById('files');
      const filtered = getFilteredFiles();
      thumbnailObserver?.disconnect();
      document.getElementById('fileCount').textContent = filtered.length;
      document.getElementById('totalSize').textContent = formatSize(filtered.reduce((sum, f) => sum + (f.size || 0), 0));
      if (!filtered.length) {
        filesDiv.innerHTML = '<div class="empty">No files found</div>';
        return;
      }
      filesDiv.innerHTML = filtered.map((file, index) => {
        const url = escapeHtml(fileUrl(file));
        const name = escapeHtml(file.name);
        const category = getCategory(file.name);
        let media = `<span class="icon">${getIcon(file.mimeType)}</span>`;
        if (category === 'image') media = `<img src="${url}" alt="" loading="lazy">`;
        if (category === 'video') media = `<video data-src="${url}" muted playsinline preload="none" aria-hidden="true"></video><span class="play-label">▶ Preview video</span>`;
        if (category === 'audio') media = '<span class="icon">🎵</span><span class="play-label">▶ Listen</span>';
        if (file.name.toLowerCase().endsWith('.pdf')) media = '<span class="icon">📄</span><span class="play-label">Preview PDF</span>';
        return `<article class="file-card">
          <button class="file-preview" type="button" data-preview="${index}" aria-label="Preview ${name}">${media}</button>
          <div class="file-info">
            <div class="file-name" title="${name}">${name}</div>
            <div class="file-meta"><span>${formatSize(file.size)}</span><button class="copy-btn" type="button" data-copy="${index}">Copy link</button></div>
          </div></article>`;
      }).join('');
      filesDiv.querySelectorAll('[data-preview]').forEach(button => button.addEventListener('click', () => openPreview(filtered[Number(button.dataset.preview)])));
      filesDiv.querySelectorAll('[data-copy]').forEach(button => button.addEventListener('click', () => copyLink(fileUrl(filtered[Number(button.dataset.copy)]), button)));
      filesDiv.querySelectorAll('img').forEach(img => img.addEventListener('error', () => { img.replaceWith(document.createTextNode('Image preview unavailable')); }));
      thumbnailObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const video = entry.target;
          thumbnailObserver.unobserve(video);
          video.addEventListener('loadedmetadata', () => { if (video.duration > 0) video.currentTime = Math.min(1, video.duration / 2); }, { once: true });
          video.addEventListener('error', () => { video.replaceWith(document.createTextNode('Video preview unavailable')); }, { once: true });
          video.src = video.dataset.src;
          video.preload = 'metadata';
          video.load();
        });
      }, { rootMargin: '100px' });
      filesDiv.querySelectorAll('video').forEach(video => thumbnailObserver.observe(video));
    }

    const previewDialog = document.getElementById('previewDialog');
    const previewBody = document.getElementById('previewBody');
    function openPreview(file) {
      previewBody.replaceChildren();
      document.getElementById('previewTitle').textContent = file.name;
      document.getElementById('previewStatus').textContent = '';
      const url = fileUrl(file);
      document.getElementById('previewOpen').href = url;
      document.getElementById('previewCopy').onclick = async () => {
        try { await navigator.clipboard.writeText(url); document.getElementById('previewStatus').textContent = 'Link copied'; }
        catch { document.getElementById('previewStatus').textContent = 'Copy unavailable. Use Open original to get the link.'; }
      };
      const category = getCategory(file.name);
      let media;
      if (category === 'image') { media = document.createElement('img'); media.alt = file.name; }
      else if (category === 'video' || category === 'audio') {
        media = document.createElement(category); media.controls = true; media.preload = 'metadata';
        if (category === 'video') media.playsInline = true;
      } else if (file.name.toLowerCase().endsWith('.pdf')) {
        media = document.createElement('iframe'); media.title = 'PDF preview: ' + file.name;
      }
      if (media) {
        media.src = url;
        media.addEventListener('error', () => { document.getElementById('previewStatus').textContent = 'Your browser cannot preview this file. Use Open original.'; });
        previewBody.append(media);
      } else { previewBody.textContent = 'Preview unavailable for this file type. Open the original to view or download it.'; }
      previewDialog.showModal();
    }
    document.getElementById('closePreview').addEventListener('click', () => previewDialog.close());
    previewDialog.addEventListener('close', () => { previewBody.querySelectorAll('video, audio').forEach(media => { media.pause(); media.removeAttribute('src'); media.load(); }); previewBody.replaceChildren(); });
    previewDialog.addEventListener('click', event => { if (event.target === previewDialog) { const rect = previewDialog.getBoundingClientRect(); if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) previewDialog.close(); } });

    function copyLink(url, btn) {
      navigator.clipboard.writeText(url).then(() => {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
      }).catch(() => { btn.textContent = 'Copy failed'; });
    }
    
    async function loadFiles() {
      const filesDiv = document.getElementById('files');
      
      try {
        const res = await fetch(WORKER_URL);
        if (res.ok) {
          const data = await res.json();
          allFiles = data.files || [];
        }
        
        if (allFiles.length === 0) {
          filesDiv.innerHTML = '<div class="empty">No files yet. Upload some files!</div>';
          return;
        }
        
        allFiles.sort((a, b) => new Date(b.uploadedAt || 0) - new Date(a.uploadedAt || 0));
        
        folderCounts = getFolders(allFiles);
        renderFolders();
        
        const totalSize = allFiles.reduce((sum, f) => sum + (f.size || 0), 0);
        document.getElementById('fileCount').textContent = allFiles.length;
        document.getElementById('totalSize').textContent = formatSize(totalSize);
        
        renderFiles();
      } catch (error) {
        filesDiv.innerHTML = `<div class="error">Error: ${escapeHtml(error.message)}</div>`;
      }
    }
    
    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderFiles();
      });
    });
    
    // Search
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');
    
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      clearSearch.classList.toggle('visible', searchQuery.length > 0);
      renderFiles();
    });
    
    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearch.classList.remove('visible');
      renderFiles();
    });
    
    loadFiles();
  </script>
</body>
</html>
